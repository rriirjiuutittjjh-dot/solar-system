<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0f0728; color: #d0c8f0; font-family: 'Courier New', Courier, monospace; user-select: none; }
        canvas { display: block; }
        
        #ui-header {
            position: absolute;
            top: 15px;
            left: 20px;
            pointer-events: none;
        }
        #ui-header h2 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 10px #7b42ff; }
        #ui-header p { margin: 4px 0 0 0; font-size: 0.75rem; color: #8e80bf; }

        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(22, 12, 48, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(123, 66, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d0c8f0;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        button:hover { 
            background: rgba(123, 66, 255, 0.3); 
            border-color: #a77bff;
            color: #ffffff;
        }

        #stats-card {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 170px;
            padding: 12px;
            background: rgba(22, 12, 48, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(123, 66, 255, 0.3);
            font-size: 0.75rem;
        }
        #stats-card h3 { margin: 0 0 8px 0; color: #ffcc00; font-size: 0.85rem; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 4px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #8e80bf; }
        .stat-row span:last-child { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui-header">
        <h2>SOLAR SYSTEM</h2>
        <p>Drag to launch • Right-click for AI probe</p>
    </div>

    <div id="stats-card">
        <h3>SYSTEM DATA</h3>
        <div class="stat-row"><span>BODIES:</span> <span id="body-count">1</span></div>
        <div class="stat-row"><span>PRESET:</span> <span id="selected-preset">Custom</span></div>
    </div>

    <div id="toolbar">
        <button onclick="setSpawnType('mercury')">MERCURY</button>
        <button onclick="setSpawnType('venus')">VENUS</button>
        <button onclick="setSpawnType('earth')">EARTH</button>
        <button onclick="setSpawnType('mars')">MARS</button>
        <button onclick="setSpawnType('jupiter')">JUPITER</button>
        <button onclick="setSpawnType('saturn')">SATURN</button>
        <button onclick="setSpawnType('uranus')">URANUS</button>
        <button onclick="setSpawnType('neptune')">NEPTUNE</button>
        <button onclick="resetSystem()" style="border-color: #ff5577; color: #ff5577;">RESET</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bodyCountEl = document.getElementById('body-count');
        const presetEl = document.getElementById('selected-preset');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playLaunchSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        const G = 0.5;
        let bodies = [];
        let particles = [];
        let dragStart = null;
        let mousePos = { x: 0, y: 0 };
        let currentSpawnType = 'custom';

        const PRESETS = {
            custom: { name: 'CUSTOM', mass: 10, radius: 6, color: '#4da6ff' },
            mercury: { name: 'MERCURY', mass: 4, radius: 4, color: '#e5c199' },
            venus: { name: 'VENUS', mass: 9, radius: 7, color: '#ffdd99' },
            earth: { name: 'EARTH', mass: 10, radius: 7, color: '#55aaff', moons: 1 },
            mars: { name: 'MARS', mass: 6, radius: 5, color: '#ff6644', moons: 2 },
            jupiter: { name: 'JUPITER', mass: 80, radius: 14, color: '#ffcc88', moons: 4, rings: true },
            saturn: { name: 'SATURN', mass: 50, radius: 12, color: '#ffe699', moons: 3, rings: true },
            uranus: { name: 'URANUS', mass: 30, radius: 10, color: '#77eeee', moons: 2, rings: true },
            neptune: { name: 'NEPTUNE', mass: 32, radius: 10, color: '#5577ff', moons: 1 }
        };

        class Body {
            constructor(x, y, vx, vy, mass, radius, color, name = '', isAI = false, isStar = false, moons = 0, rings = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.name = name;
                this.isAI = isAI;
                this.isStar = isStar;
                this.moons = moons;
                this.rings = rings;
                this.history = [];
                this.moonAngle = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.moonAngle += 0.03;

                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 60) this.history.shift();

                if (this.isAI && (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1)) {
                    particles.push(new Particle(
                        this.x - (this.vx * 1.5), 
                        this.y - (this.vy * 1.5), 
                        -this.vx * 0.2 + (Math.random() - 0.5) * 0.5, 
                        -this.vy * 0.2 + (Math.random() - 0.5) * 0.5, 
                        2, '#00ffff', 18
                    ));
                }
            }

            draw() {
                // Elliptical Orbit Track Lines
                if (this.history.length > 1 && !this.isStar) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);
                    for (let p of this.history) {
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.strokeStyle = 'rgba(123, 66, 255, 0.25)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Render Sun with Stylized Rays
                if (this.isStar) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    
                    // Draw Sun Rays
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 3;
                    const rays = 12;
                    for (let i = 0; i < rays; i++) {
                        const angle = (i * Math.PI * 2) / rays;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * (this.radius + 4), Math.sin(angle) * (this.radius + 4));
                        ctx.lineTo(Math.cos(angle) * (this.radius + 18), Math.sin(angle) * (this.radius + 18));
                        ctx.stroke();
                    }

                    // Sun Core
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffdd44';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffaa00';
                    ctx.fill();
                    ctx.restore();
                } else {
                    // Draw Rings
                    if (this.rings) {
                        ctx.beginPath();
                        ctx.ellipse(this.x, this.y, this.radius * 2.2, this.radius * 0.7, Math.PI / 6, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(255, 230, 150, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    // Draw Planet Body
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = this.isAI ? 10 : 4;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Draw Moons
                    for (let i = 0; i < this.moons; i++) {
                        const mDist = this.radius + 10 + (i * 6);
                        const mAngle = this.moonAngle + (i * (Math.PI * 2 / this.moons));
                        const mx = this.x + Math.cos(mAngle) * mDist;
                        const my = this.y + Math.sin(mAngle) * (mDist * 0.4);
                        
                        ctx.beginPath();
                        ctx.arc(mx, my, 1.8, 0, Math.PI * 2);
                        ctx.fillStyle = '#d0c8f0';
                        ctx.fill();
                    }

                    // Planet Label
                    if (this.name) {
                        ctx.font = '10px "Courier New", monospace';
                        ctx.fillStyle = '#d0c8f0';
                        ctx.textAlign = 'center';
                        ctx.fillText(this.name, this.x, this.y + this.radius + 14);
                    }
                }
            }
        }

        class Particle {
            constructor(x, y, vx, vy, radius, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius * (this.life / this.maxLife)), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initSun() {
            bodies = [new Body(canvas.width / 2, canvas.height / 2, 0, 0, 2000, 24, '#ffdd44', 'SUN', false, true)];
        }

        function setSpawnType(type) {
            currentSpawnType = type;
            presetEl.textContent = PRESETS[type].name;
        }

        function resetSystem() {
            initSun();
            particles = [];
        }

        function createExplosion(x, y, color) {
            playExplosionSound();
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 0.5;
                particles.push(new Particle(
                    x, y, 
                    Math.cos(angle) * speed, 
                    Math.sin(angle) * speed, 
                    Math.random() * 2.5 + 1, color, 35
                ));
            }
        }

        function applyGravity() {
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const b1 = bodies[i];
                    const b2 = bodies[j];
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < b1.radius + b2.radius) {
                        createExplosion((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.mass > b2.mass ? b1.color : b2.color);
                        const totalMass = b1.mass + b2.mass;
                        b1.vx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
                        b1.vy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;
                        b1.mass = totalMass;
                        b1.radius = Math.min(45, Math.sqrt(b1.radius * b1.radius + b2.radius * b2.radius));
                        bodies.splice(j, 1);
                        j--;
                        continue;
                    }

                    const force = (G * b1.mass * b2.mass) / distSq;
                    const fx = (force * dx) / dist;
                    const fy = (force * dy) / dist;

                    b1.vx += fx / b1.mass;
                    b1.vy += fy / b1.mass;
                    b2.vx -= fx / b2.mass;
                    b2.vy -= fy / b2.mass;
                }
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            initAudio();
            if (e.button === 0) dragStart = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0 && dragStart) {
                const vx = (dragStart.x - e.clientX) * 0.04;
                const vy = (dragStart.y - e.clientY) * 0.04;
                const p = PRESETS[currentSpawnType];
                bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, p.mass, p.radius, p.color, p.name, false, false, p.moons || 0, p.rings || false));
                playLaunchSound();
                dragStart = null;
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            initAudio();
            bodies.push(new Body(e.clientX, e.clientY, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 5, 4, '#00ffff', 'PROBE', true));
        });

        function gameLoop() {
            ctx.fillStyle = '#0f0728';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            applyGravity();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            bodies.forEach(b => { b.update(); b.draw(); });

            if (dragStart) {
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.setLineDash([3, 3]);
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            bodyCountEl.textContent = bodies.length;
            requestAnimationFrame(gameLoop);
        }

        initSun();
        gameLoop();
    </script>
</body>
</html>
