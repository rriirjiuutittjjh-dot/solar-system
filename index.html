<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Space Sandbox - Modern Skin</title>
    <style>
        body { margin: 0; overflow: hidden; background: #030308; color: #e0e6ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; }
        
        #ui-header {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        #ui-header h2 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; color: #ffffff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        #ui-header p { margin: 4px 0 0 0; font-size: 0.8rem; color: #8a99ad; }

        #toolbar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(10, 12, 24, 0.75);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 229, 255, 0.05);
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d0d8ff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            font-weight: 500;
        }

        button:hover { 
            background: rgba(0, 229, 255, 0.2); 
            border-color: #00e5ff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0,229,255,0.4);
        }

        #stats-card {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 190px;
            padding: 16px;
            background: rgba(10, 12, 24, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            font-size: 0.85rem;
        }
        #stats-card h3 { margin: 0 0 12px 0; color: #00e5ff; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; color: #8a99ad; }
        .stat-row span:last-child { color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>
    <div id="ui-header">
        <h2>SOLAR SANDBOX</h2>
        <p>Drag to launch • Right-click for AI probe</p>
    </div>

    <div id="stats-card">
        <h3>Telemetry</h3>
        <div class="stat-row"><span>Bodies:</span> <span id="body-count">1</span></div>
        <div class="stat-row"><span>Preset:</span> <span id="selected-preset">Custom</span></div>
    </div>

    <div id="toolbar">
        <button onclick="setSpawnType('earth')">Earth</button>
        <button onclick="setSpawnType('mars')">Mars</button>
        <button onclick="setSpawnType('jupiter')">Jupiter</button>
        <button onclick="resetSystem()" style="border-color: rgba(255, 85, 85, 0.4); color: #ff6666;">Reset</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bodyCountEl = document.getElementById('body-count');
        const presetEl = document.getElementById('selected-preset');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playLaunchSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        const G = 0.5;
        let bodies = [];
        let particles = [];
        let dragStart = null;
        let mousePos = { x: 0, y: 0 };
        let currentSpawnType = 'custom';

        const PRESETS = {
            custom: { mass: 10, radius: 6, color: '#00e5ff' },
            earth: { mass: 12, radius: 7, color: '#00aaff' },
            mars: { mass: 6, radius: 5, color: '#ff4433' },
            jupiter: { mass: 80, radius: 14, color: '#ffaa44' }
        };

        class Body {
            constructor(x, y, vx, vy, mass, radius, color, isAI = false, isStar = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.isAI = isAI;
                this.isStar = isStar;
                this.history = [];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 50) this.history.shift();

                if (this.isAI && (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1)) {
                    particles.push(new Particle(
                        this.x - (this.vx * 1.5), 
                        this.y - (this.vy * 1.5), 
                        -this.vx * 0.2 + (Math.random() - 0.5) * 0.5, 
                        -this.vy * 0.2 + (Math.random() - 0.5) * 0.5, 
                        2, '#00ffff', 18
                    ));
                }
            }

            draw() {
                // Orbit path rendering
                if (this.history.length > 1 && !this.isStar) {
                    for (let i = 0; i < this.history.length - 1; i++) {
                        const alpha = (i / this.history.length) * 0.4;
                        ctx.beginPath();
                        ctx.moveTo(this.history[i].x, this.history[i].y);
                        ctx.lineTo(this.history[i + 1].x, this.history[i + 1].y);
                        ctx.strokeStyle = this.color;
                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                }

                // Celestial Body Glow
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                if (this.isStar) {
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ffaa00';
                } else if (this.isAI) {
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#00ffff';
                } else {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                }
                
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, radius, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius * (this.life / this.maxLife)), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initSun() {
            bodies = [new Body(canvas.width / 2, canvas.height / 2, 0, 0, 2000, 22, '#ffcc00', false, true)];
        }

        function setSpawnType(type) {
            currentSpawnType = type;
            presetEl.textContent = type.charAt(0).toUpperCase() + type.slice(1);
        }

        function resetSystem() {
            initSun();
            particles = [];
        }

        function createExplosion(x, y, color) {
            playExplosionSound();
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 0.5;
                particles.push(new Particle(
                    x, y, 
                    Math.cos(angle) * speed, 
                    Math.sin(angle) * speed, 
                    Math.random() * 2.5 + 1, color, 35
                ));
            }
        }

        function applyGravity() {
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const b1 = bodies[i];
                    const b2 = bodies[j];
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < b1.radius + b2.radius) {
                        createExplosion((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.mass > b2.mass ? b1.color : b2.color);
                        const totalMass = b1.mass + b2.mass;
                        b1.vx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
                        b1.vy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;
                        b1.mass = totalMass;
                        b1.radius = Math.min(45, Math.sqrt(b1.radius * b1.radius + b2.radius * b2.radius));
                        bodies.splice(j, 1);
                        j--;
                        continue;
                    }

                    const force = (G * b1.mass * b2.mass) / distSq;
                    const fx = (force * dx) / dist;
                    const fy = (force * dy) / dist;

                    b1.vx += fx / b1.mass;
                    b1.vy += fy / b1.mass;
                    b2.vx -= fx / b2.mass;
                    b2.vy -= fy / b2.mass;
                }
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            initAudio();
            if (e.button === 0) dragStart = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0 && dragStart) {
                const vx = (dragStart.x - e.clientX) * 0.04;
                const vy = (dragStart.y - e.clientY) * 0.04;
                const p = PRESETS[currentSpawnType];
                bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, p.mass, p.radius, p.color));
                playLaunchSound();
                dragStart = null;
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            initAudio();
            bodies.push(new Body(e.clientX, e.clientY, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 5, 4, '#00ffff', true));
        });

        function gameLoop() {
            ctx.fillStyle = '#030308';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            applyGravity();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            bodies.forEach(b => { b.update(); b.draw(); });

            if (dragStart) {
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.6)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            bodyCountEl.textContent = bodies.length;
            requestAnimationFrame(gameLoop);
        }

        initSun();
        gameLoop();
    </script>
</body>
</html>
