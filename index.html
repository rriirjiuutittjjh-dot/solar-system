<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Space Sandbox</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050d; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Solar System Sandbox</h2>
        <p>Click & Drag to launch planets | Right Click to spawn AI probe</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const G = 0.5;
        const bodies = [];
        const particles = [];
        let dragStart = null;
        let mousePos = { x: 0, y: 0 };

        class Body {
            constructor(x, y, vx, vy, mass, radius, color, isAI = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.isAI = isAI;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Create trail particles for AI ships
                if (this.isAI && (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1)) {
                    particles.push(new Particle(
                        this.x - (this.vx * 2), 
                        this.y - (this.vy * 2), 
                        -this.vx * 0.2 + (Math.random() - 0.5), 
                        -this.vy * 0.2 + (Math.random() - 0.5), 
                        2, '#00ffff', 20
                    ));
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.isAI ? 10 : 0;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, vx, vy, radius, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius * (this.life / this.maxLife)), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Spawn central Star
        bodies.push(new Body(canvas.width / 2, canvas.height / 2, 0, 0, 2000, 25, '#ffcc00'));

        function createExplosion(x, y, color) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push(new Particle(
                    x, y, 
                    Math.cos(angle) * speed, 
                    Math.sin(angle) * speed, 
                    Math.random() * 3 + 1, color, 40
                ));
            }
        }

        function applyGravity() {
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const b1 = bodies[i];
                    const b2 = bodies[j];
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < b1.radius + b2.radius) {
                        // Merge on collision
                        createExplosion((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.mass > b2.mass ? b1.color : b2.color);
                        const totalMass = b1.mass + b2.mass;
                        b1.vx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
                        b1.vy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;
                        b1.mass = totalMass;
                        b1.radius = Math.min(50, Math.sqrt(b1.radius * b1.radius + b2.radius * b2.radius));
                        bodies.splice(j, 1);
                        j--;
                        continue;
                    }

                    const force = (G * b1.mass * b2.mass) / distSq;
                    const fx = (force * dx) / dist;
                    const fy = (force * dy) / dist;

                    b1.vx += fx / b1.mass;
                    b1.vy += fy / b1.mass;
                    b2.vx -= fx / b2.mass;
                    b2.vy -= fy / b2.mass;
                }
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) dragStart = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            mousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0 && dragStart) {
                const vx = (dragStart.x - e.clientX) * 0.05;
                const vy = (dragStart.y - e.clientY) * 0.05;
                bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, 10, 6, '#4da6ff'));
                dragStart = null;
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            bodies.push(new Body(e.clientX, e.clientY, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 5, 5, '#00ffff', true));
        });

        function gameLoop() {
            ctx.fillStyle = 'rgba(5, 5, 13, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            applyGravity();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            bodies.forEach(b => { b.update(); b.draw(); });

            if (dragStart) {
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
